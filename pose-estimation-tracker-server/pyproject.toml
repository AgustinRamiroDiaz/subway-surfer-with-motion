[project]
name = "pose-estimation-tracker-server"
version = "0.1.0"
description = "WebRTC pose tracker for the Webcam Motion Games UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15.0",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.126",
    "websockets>=17.0.1",
]

[project.scripts]
pose-tracker-server = "pose_estimation_tracker_server.server:main"
pose-tracker-preview = "pose_estimation_tracker_server.preview:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
